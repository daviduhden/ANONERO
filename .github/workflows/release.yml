name: Build and publish APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.2.3
        required: true
        type: string
      publish:
        description: Publish signed APKs to GitHub Releases
        required: false
        type: boolean
        default: false
      run_instrumented:
        description: Run the API 35 emulator tests
        required: false
        type: boolean
        default: true

# Default to read-only. Only the publish job gets contents: write.
permissions:
  contents: read

# Never let two runs publish the same ref concurrently. A release must not be
# cancelled halfway through asset upload.
concurrency:
  group: anonero-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # The APK verification below rejects any output whose manifest reports another
  # minSdk. compileSdk is 37.2; targetSdk remains 37.0.
  ANDROID_MIN_SDK: '29'
  ANDROID_COMPILE_SDK: '37'
  ANDROID_COMPILE_SDK_MINOR: '2'
  # Keep NDK/CMake aligned with app/build.gradle.kts and external-libs/build.sh.
  ANDROID_BUILD_TOOLS: '37.0.0'
  ANDROID_NDK: '30.0.16248370'
  ANDROID_CMAKE: '4.1.2'

jobs:
  authorize:
    name: Owner authorization
    # Manual dispatch is not owner-only by itself. This job is the executable gate:
    # every other job needs it, so a non-owner dispatch has no runnable jobs.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Confirm repository owner
        shell: bash
        run: |
          echo "Owner authorization passed"

  # BEGIN GENERATED TEST JOBS
  unit:
    name: JVM unit tests
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar || {
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing; commit the pinned wrapper."
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n%.0s' {1..100} | sdkmanager --licenses >/dev/null 2>&1
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}.${ANDROID_COMPILE_SDK_MINOR}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          test -x "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
          validate-wrappers: true

      - name: Run Kotlin/JVM unit tests for both flavors
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --continue --stacktrace \
            :app:testAnonDebugUnitTest \
            :app:testNeroDebugUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/test-results/testAnonDebugUnitTest/**
            app/build/test-results/testNeroDebugUnitTest/**
            app/build/reports/tests/testAnonDebugUnitTest/**
            app/build/reports/tests/testNeroDebugUnitTest/**
            app/build/reports/problems/problems-report.html
            build/reports/problems/problems-report.html
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Android Lint
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar || {
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing; commit the pinned wrapper."
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n%.0s' {1..100} | sdkmanager --licenses >/dev/null 2>&1
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}.${ANDROID_COMPILE_SDK_MINOR}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
          validate-wrappers: true

      - name: Run Android Lint for both flavors
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --continue --stacktrace :app:lintAnonDebug :app:lintNeroDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.txt
            app/build/reports/problems/problems-report.html
            build/reports/problems/problems-report.html
          if-no-files-found: warn
          retention-days: 14

  jni-contract:
    name: JNI symbol contract
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Compare Kotlin external declarations and JNI exports
        shell: bash
        run: python3 scripts/check-jni-contract.py

      - name: Reject unsafe native diagnostics
        shell: bash
        run: python3 scripts/check-native-diagnostics.py

      - name: Check Android anonymity source boundaries
        shell: bash
        run: python3 scripts/check-anonymity-boundaries.py

      - name: Check Kotlin cancellation catch imports
        shell: bash
        run: python3 scripts/check-kotlin-cancellation.py

      - name: Verify shared manual workflow jobs
        shell: bash
        run: python3 scripts/sync-release-test-jobs.py --check

      - name: Run static checker regression tests
        shell: bash
        run: python3 -m unittest discover -s scripts/tests

  i18n:
    name: Localization resources
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check resource parity and hardcoded UI text
        shell: bash
        run: python3 scripts/check-i18n.py

  native-language-policy:
    name: Kotlin and C++ architecture policy
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Reject project-owned Java sources
        shell: bash
        run: |
          set -euo pipefail
          if find . -name '*.java' -not -path './.git/*' -not -path './external-libs/*' -print -quit | grep -q .; then
            echo "::error::Project-owned Java conflicts with the Kotlin/C++ architecture policy."
            exit 1
          fi

  native:
    name: Build native Monero/JNI archives
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - name: Set native artifact name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "artifact=anonero-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Free runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup
          docker system prune -af
          df -h /

      - name: Check out source and pinned Monero submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify pinned native inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -f external-libs/monero/Makefile ]] || {
            echo "::error::Monero submodule is not initialized; run checkout with submodules."
            exit 1
          }
          shopt -s nullglob
          patches=(external-libs/patches/*.patch)
          (( ${#patches[@]} > 0 )) || {
            echo "::error::Pinned ANONERO Monero patch series is missing from external-libs/patches/."
            exit 1
          }

      - name: Build native archives
        shell: bash
        run: |
          set -euo pipefail
          make -C external-libs android NPROC=4 2>&1 | tee native-build.log
          for f in \
            external-libs/arm64-v8a/monero/libwallet_api.a \
            external-libs/armeabi-v7a/monero/libwallet_api.a \
            external-libs/include/wallet2_api.h; do
            [[ -s "$f" ]] || { echo "::error::missing native artifact: $f"; exit 1; }
          done

      - name: Stage native archives and build manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native-out
          mkdir -p native-out
          cp -a external-libs/arm64-v8a native-out/
          cp -a external-libs/armeabi-v7a native-out/
          cp -a external-libs/include native-out/
          cp -a external-libs/VERSION native-out/
          cp native-build.log native-out/
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "monero_sha=$(git -C external-libs/monero rev-parse HEAD)"
            echo "monero_describe=$(git -C external-libs/monero describe --tags --always)"
            sha256sum external-libs/patches/*.patch
            find native-out -type f -print0 | sort -z | xargs -0 sha256sum
          } > native-out/NATIVE-MANIFEST.txt
          du -sh native-out

      - name: Upload native archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: native-out
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble debug APKs and link JNI
    needs: [authorize, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar || {
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing; commit the pinned wrapper."
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n%.0s' {1..100} | sdkmanager --licenses >/dev/null 2>&1
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}.${ANDROID_COMPILE_SDK_MINOR}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"
          test -x "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"

      - name: Download native archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.native.outputs.artifact }}
          path: native-artifact

      - name: Install native archives
        shell: bash
        run: |
          set -euo pipefail
          if [ -d native-artifact/native-out ]; then
            cp -a native-artifact/native-out/. external-libs/
          else
            cp -a native-artifact/. external-libs/
          fi
          for f in \
            external-libs/arm64-v8a/monero/libwallet_api.a \
            external-libs/armeabi-v7a/monero/libwallet_api.a \
            external-libs/include/wallet2_api.h; do
            [[ -s "$f" ]] || { echo "::error::missing native artifact: $f"; exit 1; }
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
          validate-wrappers: true

      - name: Assemble debug APKs and verify the API 29 floor
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          test -x "$AAPT2"
          ./gradlew --no-daemon --continue --stacktrace -PanonDisableSplits=true \
            :app:assembleAnonDebug \
            :app:assembleNeroDebug
          echo "=== debug APK outputs ==="
          find app/build/outputs -maxdepth 4 -type f -printf '%p %s\n' | sort || true
          for flavor in anon nero; do
            apk="app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            [[ -s "$apk" ]] || { echo "::error::missing $apk"; exit 1; }
            badging="$("$AAPT2" dump badging "$apk")"
            min_sdk="$(printf '%s\n' "$badging" | sed -n -E "s/^[[:space:]]*(minSdkVersion|sdkVersion):'([^']*)'.*/\2/p" | head -n 1)"
            if [[ -z "$min_sdk" ]]; then
              echo "::error::could not read minSdk from $apk"
              printf '%s\n' "$badging" | sed -n '1,20p'
              exit 1
            fi
            [[ "$min_sdk" == "$ANDROID_MIN_SDK" ]] || {
              echo "::error::$apk reports minSdk '$min_sdk', expected '$ANDROID_MIN_SDK'"
              exit 1
            }
            unzip -l "$apk" | grep -q 'lib/.*/libanonero\.so' || {
              echo "::error::$apk has no libanonero.so"
              exit 1
            }
          done

      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    needs: [authorize, native, assemble]
    if: ${{ inputs.run_instrumented }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # API 35 Google APIs x86_64 includes ARM64 translation, so the
          # arm64-v8a-only ANONERO APK can run on a hosted x86_64 emulator.
          # API 29 has no equivalent ARM translation on these images; API 29
          # compile/manifest coverage is in the assemble step below.
          - api-level: 35
            target: google_apis
            arch: x86_64
            profile: pixel_5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar || {
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing; commit the pinned wrapper."
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Free runner disk
        shell: bash
        run: |
          set -euo pipefail
          # Keep /usr/local/lib/android: this job needs the SDK, emulator and NDK.
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup
          docker system prune -af || true
          df -h /

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n%.0s' {1..100} | sdkmanager --licenses >/dev/null 2>&1
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}.${ANDROID_COMPILE_SDK_MINOR}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"
          test -x "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"

      - name: Download native archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.native.outputs.artifact }}
          path: native-artifact

      - name: Install native archives
        shell: bash
        run: |
          set -euo pipefail
          if [ -d native-artifact/native-out ]; then
            cp -a native-artifact/native-out/. external-libs/
          else
            cp -a native-artifact/. external-libs/
          fi
          for f in \
            external-libs/arm64-v8a/monero/libwallet_api.a \
            external-libs/armeabi-v7a/monero/libwallet_api.a \
            external-libs/include/wallet2_api.h; do
            [[ -s "$f" ]] || { echo "::error::missing native artifact: $f"; exit 1; }
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
          validate-wrappers: true

      - name: Assemble app and test APKs and verify the API 29 floor
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          test -x "$AAPT2"
          # Build the test APKs before the emulator starts. Compiling and dexing them
          # while the software-emulated guest runs starves system_server and can kill it.
          ./gradlew --no-daemon --continue --stacktrace -PanonDisableSplits=true \
            :app:assembleAnonDebug \
            :app:assembleNeroDebug \
            :app:assembleAnonDebugAndroidTest \
            :app:assembleNeroDebugAndroidTest
          for flavor in anon nero; do
            apk="app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            [[ -s "$apk" ]] || { echo "::error::missing $apk"; exit 1; }
            badging="$("$AAPT2" dump badging "$apk")"
            min_sdk="$(printf '%s\n' "$badging" | sed -n -E "s/^[[:space:]]*(minSdkVersion|sdkVersion):'([^']*)'.*/\2/p" | head -n 1)"
            if [[ -z "$min_sdk" ]]; then
              echo "::error::could not read minSdk from $apk"
              printf '%s\n' "$badging" | sed -n '1,20p'
              exit 1
            fi
            [[ "$min_sdk" == "$ANDROID_MIN_SDK" ]] || {
              echo "::error::$apk reports minSdk '$min_sdk', expected '$ANDROID_MIN_SDK'"
              exit 1
            }
            unzip -l "$apk" | grep -q 'lib/.*/libanonero\.so' || {
              echo "::error::$apk has no libanonero.so"
              exit 1
            }
            test_apk="$(find app/build/outputs/apk -type f \
              -path "*${flavor}*" -name "*androidTest*.apk" | head -n 1)"
            [[ -s "$test_apk" ]] || {
              echo "::error::missing AndroidTest APK for $flavor"
              exit 1
            }
          done

      - name: Prepare emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "KVM device is unavailable; the emulator will use its bounded software mode."
            exit 0
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            # This device belongs to the ephemeral GitHub-hosted VM. Grant access
            # to the current job user without opening the device to all users.
            sudo chown "$(id -u)" /dev/kvm
            sudo chmod u+rw /dev/kvm
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::The instrumented runner cannot access the KVM device"
            exit 1
          fi

      - name: Run instrumented tests on API ${{ matrix.api-level }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          # The action selects -accel off if KVM is unavailable. Current emulator
          # versions require an explicit opt-in to start that software path.
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: 2048M
          # Optional settings writes failed before our readiness/test script in
          # 43633496677. Keep the guest's defaults; all test/result gates stay required.
          disable-animations: false
          emulator-boot-timeout: 1200
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            bash .github/scripts/run-instrumented.sh

      - name: Verify instrumented results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob(
              "app/build/outputs/androidTest-results/**/TEST-*.xml",
              recursive=True,
          ))
          if not files:
              print("::error::no instrumented test reports were produced")
              sys.exit(1)

          flavors = set()
          failed = []
          for path in files:
              root = ET.parse(path).getroot()
              tests = int(root.get("tests", "0"))
              failures = int(root.get("failures", "0"))
              errors = int(root.get("errors", "0"))
              skipped = int(root.get("skipped", "0"))
              print(
                  f"{path}: tests={tests} failures={failures} errors={errors} "
                  f"skipped={skipped}"
              )
              if "flavors/" in path:
                  flavors.add(path.split("flavors/", 1)[1].split("/", 1)[0])
              if failures or errors or skipped or tests == 0:
                  failed.append(path)
              for testcase in root.iter("testcase"):
                  for failure in testcase.findall("failure"):
                      text = (failure.text or "").lower()
                      if any(
                          marker in text
                          for marker in (
                              "failed to attach",
                              "failed to install",
                              "test run failed",
                              "testrunfailed",
                              "process crashed",
                              "broken pipe",
                              "can't find service",
                              "failure calling service package",
                          )
                      ):
                          failed.append(path)

          for flavor in ("anon", "nero"):
              codes = glob.glob(
                  f"app/build/outputs/androidTest-results/**/flavors/{flavor}/"
                  "**/test-result-exit-code.txt",
                  recursive=True,
              )
              if not codes:
                  print(f"::error::missing test-result-exit-code.txt for {flavor}")
                  failed.append(flavor)
                  continue
              for code_path in codes:
                  with open(code_path, encoding="utf-8") as code_file:
                      code = code_file.read().strip()
                  print(f"{code_path}: exit={code}")
                  if code != "0":
                      failed.append(code_path)

          if flavors != {"anon", "nero"}:
              print(f"::error::expected anon and nero reports, got {sorted(flavors)}")
              sys.exit(1)
          if failed:
              print("::error::instrumented test failures: " + ", ".join(failed))
              sys.exit(1)
          PY

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-api${{ matrix.api-level }}-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

  test:
    name: Required test suite
    needs: [authorize, unit, lint, jni-contract, i18n, native-language-policy, native, assemble, instrumented]
    # Run the aggregate even if a required job failed or was skipped; reject it below.
    if: ${{ always() && needs.authorize.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      native_artifact: ${{ needs.native.outputs.artifact }}
    steps:
      - name: Require all tests and the native artifact from this run
        shell: bash
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_INSTRUMENTED: ${{ inputs.run_instrumented }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["JOB_RESULTS"])
          required = ['authorize', 'unit', 'lint', 'jni-contract', 'i18n', 'native-language-policy', 'native', 'assemble', 'instrumented']
          run_instrumented = os.environ["RUN_INSTRUMENTED"] == "true"
          for name in required:
              expected = "success"
              if name == "instrumented" and not run_instrumented:
                  expected = "skipped"
              actual = jobs.get(name, {}).get("result")
              if actual != expected:
                  raise SystemExit(f"Required job {name}: expected {expected}, got {actual}")
          artifact = jobs.get("native", {}).get("outputs", {}).get("artifact", "")
          if not artifact:
              raise SystemExit("Required native artifact output is missing")
          print("Required test suite passed in this workflow execution")
          PY
  # END GENERATED TEST JOBS

  build:
    name: Build and verify unsigned APKs
    needs: [authorize, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      tag: ${{ steps.meta.outputs.tag }}
      artifact_version: ${{ steps.meta.outputs.artifact_version }}
      is_release: ${{ steps.meta.outputs.is_release }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      source_sha: ${{ steps.meta.outputs.source_sha }}

    steps:
      - name: Free runner disk before build
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup || true
          df -h /

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar || {
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing; commit the pinned wrapper."
            exit 1
          }

      - name: Determine version and verify tag
        id: meta
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION" || -z "$VERSION_CODE" ]]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi

          TAG="${TAG_INPUT:-}"
          if [[ -z "$TAG" ]]; then
            echo "::error::A tag input is required; enter an existing v* release tag."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid release tag"
            exit 1
          fi
          CORE="${TAG#v}"
          CORE="${CORE%%[+-]*}"
          if [[ "$CORE" != "$VERSION" ]]; then
            echo "::error::Tag core version '$CORE' does not match app versionName '$VERSION'"
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/${TAG}" || {
            echo "::error::$TAG is not an existing tag"
            exit 1
          }
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [[ "$HEAD_COMMIT" != "$TAG_COMMIT" ]] || [[ "$HEAD_COMMIT" != "$DISPATCH_SHA" ]]; then
            echo "::error::Tag '$TAG' does not match the dispatched main commit"
            exit 1
          fi

          IS_RELEASE="true"
          IS_PRERELEASE="false"
          if [[ "${TAG#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            IS_PRERELEASE="true"
          fi

          ARTIFACT_VERSION="$TAG"
          SOURCE_SHA="$(git rev-parse HEAD)"
          {
            echo "source_sha=$SOURCE_SHA"
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "tag=$TAG"
            echo "artifact_version=$ARTIFACT_VERSION"
            echo "is_release=$IS_RELEASE"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Tag: $TAG"
          echo "Release: $IS_RELEASE (prerelease=$IS_PRERELEASE)"

      # Kotlin/Compose and C++/JNI are the permanent architecture.
      - name: Enforce the Kotlin and C++ architecture policy
        shell: bash
        run: |
          set -euo pipefail
          if find . -name '*.java' -not -path './external-libs/*' -not -path './.git/*' -print -quit | grep -q .; then
            echo "::error::Project-owned Java conflicts with the Kotlin/C++ architecture policy."
            exit 1
          fi

      - name: Download native archives from the test job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.test.outputs.native_artifact }}
          path: native-artifact

      - name: Install native archives
        shell: bash
        run: |
          set -euo pipefail
          if [ -d native-artifact/native-out ]; then
            cp -a native-artifact/native-out/. external-libs/
          else
            cp -a native-artifact/. external-libs/
          fi
          required=(
            external-libs/arm64-v8a/monero/libwallet_api.a
            external-libs/armeabi-v7a/monero/libwallet_api.a
            external-libs/include/wallet2_api.h
          )
          for f in "${required[@]}"; do
            [[ -s "$f" ]] || { echo "::error::missing native artifact: $f"; exit 1; }
          done
          echo "Native artifacts:"
          du -sh external-libs/arm64-v8a external-libs/armeabi-v7a

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n%.0s' {1..100} | sdkmanager --licenses >/dev/null 2>&1
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}.${ANDROID_COMPILE_SDK_MINOR}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"
          test -x "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Caches are deliberately disabled in the publishing workflow. A cache
          # restored into a job that uploads release assets is a poisoning vector.
          cache-disabled: true
          validate-wrappers: true

      - name: Build release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --continue --stacktrace clean \
            :app:lintAnonRelease \
            :app:lintNeroRelease \
            :app:assembleAnonRelease \
            :app:assembleNeroRelease

      - name: Upload release lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-lint-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APKs and collect architecture splits
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          ARTIFACT_VERSION: ${{ steps.meta.outputs.artifact_version }}
        run: |
          set -euo pipefail
          AAPT2="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          test -x "$AAPT2"
          readelf="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          elf="$(mktemp "$RUNNER_TEMP/apk-elf.XXXXXXXX")"
          trap 'rm -f -- "$elf"' EXIT
          rm -rf dist-unsigned
          mkdir -p dist-unsigned/{anon,nero}
          shopt -s nullglob

          total=0
          for flavor in anon nero; do
            case "$flavor" in
              anon) label="ANONERO"; expected_id="dev.uhden.anon" ;;
              nero) label="NERO"; expected_id="dev.uhden.nero" ;;
              *) echo "::error::unknown flavor $flavor"; exit 1 ;;
            esac

            apks=(app/build/outputs/apk/"$flavor"/release/*.apk)
            if (( ${#apks[@]} == 0 )); then
              echo "::error::no release APK produced for flavor $flavor"
              exit 1
            fi
            if (( ${#apks[@]} != 3 )); then
              echo "::error::expected 3 APKs (arm64-v8a, armeabi-v7a, universal) for $flavor, got ${#apks[@]}"
              exit 1
            fi

            seen=()
            for apk in "${apks[@]}"; do
              [[ -s "$apk" ]] || { echo "::error::empty APK $apk"; exit 1; }

              mapfile -t libs < <(unzip -l "$apk" | awk '/lib\/[^/]+\/libanonero\.so$/ {print $4}' | sort -u)
              if (( ${#libs[@]} == 0 )); then
                echo "::error::$apk does not contain libanonero.so"
                exit 1
              fi

              mapfile -t abis < <(
                for lib in "${libs[@]}"; do
                  abi="${lib#lib/}"
                  printf '%s\n' "${abi%%/*}"
                done | sort -u
              )
              for abi in "${abis[@]}"; do
                case "$abi" in
                  arm64-v8a|armeabi-v7a) ;;
                  *) echo "::error::$apk contains unsupported ABI $abi"; exit 1 ;;
                esac
              done

              if (( ${#abis[@]} == 1 )); then
                abi="${abis[0]}"
              elif (( ${#abis[@]} > 1 )); then
                abi="universal"
                for need in arm64-v8a armeabi-v7a; do
                  printf '%s\n' "${abis[@]}" | grep -qx "$need" || {
                    echo "::error::universal APK $apk is missing $need"
                    exit 1
                  }
                done
              else
                echo "::error::could not determine ABI for $apk"
                exit 1
              fi

              # ZIP alignment does not validate ELF LOAD segments, including prebuilt libraries.
              entries="$(unzip -Z1 "$apk")"
              while IFS= read -r entry; do
                [[ "$entry" == lib/arm64-v8a/*.so ]] || continue
                unzip -p "$apk" "$entry" > "$elf"
                headers="$("$readelf" -lW "$elf")"
                loads=0
                while read -r kind offset address _physical _filesize _memsize flags; do
                  [[ "$kind" == LOAD ]] || continue
                  alignment="${flags##* }"
                  if (( alignment < 16384 || offset % 16384 != address % 16384 )); then
                    echo "::error::$apk entry $entry has an incompatible 16 KiB ELF LOAD segment"
                    exit 1
                  fi
                  loads=$((loads + 1))
                done <<< "$headers"
                (( loads > 0 ))
              done <<< "$entries"

              badging="$("$AAPT2" dump badging "$apk")"
              package_id="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
              package_version="$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
              package_code="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
              package_min_sdk="$(printf '%s\n' "$badging" | sed -n -E "s/^[[:space:]]*(minSdkVersion|sdkVersion):'([^']*)'.*/\2/p" | head -n 1)"
              if [[ -z "$package_min_sdk" ]]; then
                echo "::error::could not read minSdk from $apk"
                printf '%s\n' "$badging" | sed -n '1,20p'
                exit 1
              fi
              [[ "$package_id" == "$expected_id" ]] || {
                echo "::error::$apk applicationId is '$package_id', expected '$expected_id'"
                exit 1
              }
              [[ "$package_version" == "$VERSION" ]] || {
                echo "::error::$apk versionName is '$package_version', expected '$VERSION'"
                exit 1
              }
              [[ "$package_code" == "$VERSION_CODE" ]] || {
                echo "::error::$apk versionCode is '$package_code', expected '$VERSION_CODE'"
                exit 1
              }
              [[ "$package_min_sdk" == "$ANDROID_MIN_SDK" ]] || {
                echo "::error::$apk minSdk is '$package_min_sdk', expected '$ANDROID_MIN_SDK' (Android 10)"
                exit 1
              }
              if printf '%s\n' "$badging" | grep -q 'application-debuggable'; then
                echo "::error::$apk is debuggable"
                exit 1
              fi

              out="dist-unsigned/${flavor}/${label}-${ARTIFACT_VERSION}-${abi}.apk"
              if [[ -e "$out" ]]; then
                echo "::error::duplicate output name $out"
                exit 1
              fi
              cp "$apk" "$out"
              seen+=("$abi")
              total=$((total + 1))
            done

            for need in arm64-v8a armeabi-v7a universal; do
              printf '%s\n' "${seen[@]}" | grep -qx "$need" || {
                echo "::error::$flavor did not produce $need"
                exit 1
              }
            done
          done

          if (( total != 6 )); then
            echo "::error::expected 6 APKs total, got $total"
            exit 1
          fi
      - name: Upload unsigned ANON APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-anon-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-unsigned/anon/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned NERO APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-nero-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-unsigned/nero/*.apk
          if-no-files-found: error
          retention-days: 30

  sign-anon:
    name: Sign ANON
    needs: [authorize, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    environment: android-anon-release
    env:
      FLAVOR: anon
      LABEL: ANONERO
      TAG: ${{ needs.build.outputs.tag }}
      CERT_SHA256: ${{ vars.ANON_CERT_SHA256 }}
    outputs:
      fingerprint: ${{ steps.verify.outputs.fingerprint }}
      public_key: ${{ steps.verify.outputs.public_key }}
    steps:
      - &release_java
        name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - &release_sdk
        name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - &release_tools
        name: Install Android SDK Build Tools
        shell: bash
        run: sdkmanager --install "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Download unsigned ANON APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-anon-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned

      - &validate_unsigned
        name: Check unsigned APKs before exposing signing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Missing or invalid environment certificate fingerprint"
            exit 1
          }
          tools="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"
          shopt -s nullglob
          apks=(unsigned/*.apk)
          (( ${#apks[@]} == 3 ))
          mkdir validated
          for abi in arm64-v8a armeabi-v7a universal; do
            apk="unsigned/$LABEL-$TAG-$abi.apk"
            [[ -s "$apk" && ! -L "$apk" ]]
            python3 - "$apk" <<'PYTHON'
          import re
          import sys
          import zipfile

          with open(sys.argv[1], "rb") as apk, zipfile.ZipFile(apk) as archive:
              for name in archive.namelist():
                  if name == "assets/adi-registration.properties":
                      sys.exit("Android ownership challenge found in a release APK")
                  if re.fullmatch(r"META-INF/(?:[^/]+\.(?:SF|RSA|DSA|EC)|SIG-[^/]+)",
                                  name, re.IGNORECASE):
                      sys.exit("APK contains a JAR signature")
              if archive.start_dir >= 16:
                  apk.seek(archive.start_dir - 16)
                  if apk.read(16) == b"APK Sig Block 42":
                      sys.exit("APK already contains an APK Signing Block")
          PYTHON
            [[ "$("$tools/aapt2" dump packagename "$apk")" == "dev.uhden.$FLAVOR" ]]
            checked="validated/${apk##*/}"
            if "$tools/zipalign" -c -P 16 -v 4 "$apk" >/dev/null; then
              cp -- "$apk" "$checked"
            else
              "$tools/zipalign" -P 16 4 "$apk" "$checked"
              "$tools/zipalign" -c -P 16 -v 4 "$checked" >/dev/null
            fi
          done

      - name: Sign ANON APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANON_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANON_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANON_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANON_KEY_ALIAS }}
        run: &sign_release |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]] || {
            echo "::error::Keystore or keystore password missing from signing environment"
            exit 1
          }
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/apk-signing.XXXXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          ks="$scratch/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          unset KEYSTORE_BASE64
          [[ -s "$ks" ]]
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          export KEY_PASSWORD
          alias="${KEY_ALIAS:-$FLAVOR}"

          # Confirm the certificate before using its private key.
          digest="$(keytool -exportcert -keystore "$ks" -alias "$alias" \
            -storepass:env KEYSTORE_PASSWORD | sha256sum)"
          [[ "${digest%% *}" == "$CERT_SHA256" ]] || {
            echo "::error::Keystore certificate does not match the configured identity"
            exit 1
          }
          signer="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          mkdir dist
          for abi in arm64-v8a armeabi-v7a universal; do
            name="$LABEL-$TAG-$abi.apk"
            "$signer" sign --ks "$ks" --ks-key-alias "$alias" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --min-sdk-version "$ANDROID_MIN_SDK" \
              --v1-signing-enabled false --v2-signing-enabled true \
              --v3-signing-enabled true --v4-signing-enabled false \
              --out "dist/$name" "validated/$name"
          done
          cp "dist/$LABEL-$TAG-universal.apk" "dist/$FLAVOR-release.apk"

      - &verify_signed
        name: Verify signed package identities and checksums
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          tools="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"
          shopt -s nullglob
          apks=(dist/*.apk)
          (( ${#apks[@]} == 4 ))
          public_key=""
          for apk in "${apks[@]}"; do
            # Ask apksigner to exercise v2 as well as v3; API 29+ normally skips v2.
            verification="$("$tools/apksigner" verify --verbose --print-certs --min-sdk-version 24 "$apk")"
            printf '%s\n' "$verification"
            grep -Fxq 'Number of signers: 1' <<< "$verification"
            grep -Fxq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$verification"
            grep -Fxq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$verification"
            digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$verification")"
            [[ "$digest" == "$CERT_SHA256" ]]
            key_digest="$(sed -n 's/^Signer #1 public key SHA-256 digest: //p' <<< "$verification")"
            [[ "$key_digest" =~ ^[0-9a-f]{64}$ && "$key_digest" == "${public_key:-$key_digest}" ]]
            public_key="$key_digest"
            [[ "$("$tools/aapt2" dump packagename "$apk")" == "dev.uhden.$FLAVOR" ]]
            "$tools/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          done
          ( cd dist && sha256sum -- *.apk > SHA256SUMS && sha256sum --strict -c SHA256SUMS )
          {
            echo "fingerprint=$CERT_SHA256"
            echo "public_key=$public_key"
          } >> "$GITHUB_OUTPUT"

      - name: Upload signed ANON APKs and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-anon-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  sign-nero:
    name: Sign NERO
    needs: [authorize, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    environment: android-nero-release
    env:
      FLAVOR: nero
      LABEL: NERO
      TAG: ${{ needs.build.outputs.tag }}
      CERT_SHA256: ${{ vars.NERO_CERT_SHA256 }}
    outputs:
      fingerprint: ${{ steps.verify.outputs.fingerprint }}
      public_key: ${{ steps.verify.outputs.public_key }}
    steps:
      - *release_java
      - *release_sdk
      - *release_tools

      - name: Download unsigned NERO APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-nero-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned

      - *validate_unsigned

      - name: Sign NERO APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NERO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NERO_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NERO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.NERO_KEY_ALIAS }}
        run: *sign_release

      - *verify_signed

      - name: Upload signed NERO APKs and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-nero-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30


  prepare:
    name: Prepare verified release assets
    needs: [authorize, build, sign-anon, sign-nero]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Download signed ANON APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-anon-${{ github.run_id }}-${{ github.run_attempt }}
          path: anon

      - name: Download signed NERO APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-nero-${{ github.run_id }}-${{ github.run_attempt }}
          path: nero

      - name: Require separate signer certificates and verify the release inventory
        shell: bash
        env:
          ANON_CERT: ${{ needs.sign-anon.outputs.fingerprint }}
          NERO_CERT: ${{ needs.sign-nero.outputs.fingerprint }}
          ANON_KEY: ${{ needs.sign-anon.outputs.public_key }}
          NERO_KEY: ${{ needs.sign-nero.outputs.public_key }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$ANON_CERT" =~ ^[0-9a-f]{64}$ && "$NERO_CERT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ANON_KEY" =~ ^[0-9a-f]{64}$ && "$NERO_KEY" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ANON_CERT" != "$NERO_CERT" && "$ANON_KEY" != "$NERO_KEY" ]] || {
            echo "::error::ANON and NERO must have distinct signer certificates and public keys"
            exit 1
          }
          mkdir dist
          shopt -s nullglob
          for flavor in anon nero; do
            label=NERO
            if [[ "$flavor" == anon ]]; then label=ANONERO; fi
            files=("$flavor"/*.apk)
            (( ${#files[@]} == 4 ))
            names=("$flavor-release.apk")
            for abi in arm64-v8a armeabi-v7a universal; do
              names+=("$label-$TAG-$abi.apk")
            done
            (
              cd "$flavor"
              sha256sum -- "${names[@]}" | sort > expected-sums
              sort SHA256SUMS | diff - expected-sums
              cmp "$flavor-release.apk" "$label-$TAG-universal.apk"
            )
            cp -- "${files[@]}" dist/
          done
          ( cd dist && sha256sum -- *.apk > SHA256SUMS )

      - name: Upload prepared release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anonero-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [authorize, build, prepare]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.run_instrumented == true && needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Publishing needs write access to create/upload release assets. The job is behind
    # the owner gate and the protected release environment.
    permissions:
      contents: write # create/upload release assets; gated by owner job and environment
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}

    steps:
      - name: Re-check the tag before publishing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          persist-credentials: false

      - name: Download signed APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anonero-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Verify release contents and checksums
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/${TAG}" || {
            echo "::error::$TAG is not an existing tag"
            exit 1
          }
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ "$TAG_COMMIT" != "$SOURCE_SHA" ]]; then
            echo "::error::Release tag moved after the build; refusing to publish"
            exit 1
          fi
          shopt -s nullglob
          apks=(dist/*.apk)
          (( ${#apks[@]} == 8 )) || {
            echo "::error::expected 8 signed APK files, got ${#apks[@]}"
            exit 1
          }
          [[ -s dist/SHA256SUMS ]] || { echo "::error::SHA256SUMS is missing"; exit 1; }
          ( cd dist && sha256sum -c SHA256SUMS )
          mapfile -t listed < <(awk '{print $2}' dist/SHA256SUMS | sort)
          mapfile -t actual < <(printf '%s\n' dist/*.apk | xargs -n1 basename | sort)
          if ! diff -u <(printf '%s\n' "${listed[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "::error::SHA256SUMS does not list exactly the published APKs"
            diff -u <(printf '%s\n' "${listed[@]}") <(printf '%s\n' "${actual[@]}") || true
            exit 1
          fi
          ls -lh dist

      - name: Create or extend the release without overwriting assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt" 2>/dev/null; then
            if [[ -s "$RUNNER_TEMP/assets.txt" ]]; then
              echo "::error::Release $TAG already has assets; refusing to overwrite published files"
              cat "$RUNNER_TEMP/assets.txt"
              exit 1
            fi
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS
            if [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" == "true" ]]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            args=(--verify-tag --draft --title "ANONERO $TAG" --generate-notes)
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}"
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS
            gh release edit "$TAG" --draft=false
          fi
